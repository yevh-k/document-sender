name: Validate

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: >-
          python -m pip install
          aiosmtplib==5.1.2
          black
          homeassistant==2025.12.0
          mypy
          pillow-heif==1.5.0
          pytest
          pytest-asyncio
          ruff
      - run: ruff check .
      - run: black --check .
      - run: mypy custom_components/document_sender
      - run: pytest -q
